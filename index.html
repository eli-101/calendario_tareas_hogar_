<style>
  .viz-root {
    color-scheme: light;
    --surface-1:      #fffcf7;
    --page-plane:     #f1eae1;
    --text-primary:   #2b2420;
    --text-secondary: #6b5f54;
    --text-muted:     #9c9086;
    --gridline:       #e7dfd2;
    --baseline:       #d8cebe;
    --border:         rgba(43,36,32,0.09);
    --accent:         #f0982e;
    --accent-ink:     #7a4c0f;
    --danger:         #b0523a;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
    background: var(--page-plane);
    color: var(--text-primary);
    display: flex;
    justify-content: center;
  }
  .heading-font { font-family: "Quicksand", -apple-system, system-ui, sans-serif; }
  .phone {
    width: 100%;
    max-width: 420px;
    min-height: 100vh;
    background: var(--page-plane);
    position: relative;
    display: flex;
    flex-direction: column;
  }
  @media (min-width: 460px) {
    .phone {
      min-height: 844px;
      margin: 24px 0;
      border-radius: 36px;
      overflow: hidden;
      box-shadow: 0 0 0 8px #111, 0 20px 50px rgba(0,0,0,0.35);
    }
  }

  .view { display: none; flex: 1; overflow-y: auto; padding: 14px 16px 90px; -webkit-overflow-scrolling: touch; }
  .view.active { display: block; }

  .top-header { padding: 8px 2px 16px; }
  .top-header h1 { font-family: "Quicksand", -apple-system, system-ui, sans-serif; font-size: 24px; font-weight: 700; margin: 0; }
  .top-header .subtitle { font-size: 13px; color: var(--text-secondary); margin-top: 3px; }

  .banner {
    margin: 0 0 16px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: var(--surface-1);
    color: var(--text-secondary);
    font-size: 12.5px;
    line-height: 1.5;
    display: flex;
    gap: 8px;
    align-items: flex-start;
    box-shadow: 0 2px 10px rgba(122,76,15,0.06);
  }
  .banner strong { color: var(--text-primary); }
  .banner .close-x { margin-left: auto; flex-shrink: 0; background: none; border: none; color: var(--text-muted); font-size: 15px; cursor: pointer; padding: 0 2px; }

  /* ---- Calendar ---- */
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .cal-nav .month-label { font-family: "Quicksand", -apple-system, system-ui, sans-serif; font-size: 18px; font-weight: 700; text-transform: capitalize; }
  .cal-nav-btns { display: flex; gap: 6px; align-items: center; }
  .icon-btn {
    width: 32px; height: 32px; border-radius: 50%; border: none; background: var(--surface-1);
    display: flex; align-items: center; justify-content: center; color: var(--accent-ink);
    cursor: pointer; box-shadow: 0 2px 6px rgba(122,76,15,0.10);
  }
  .icon-btn svg { width: 16px; height: 16px; }
  .today-btn {
    font-size: 12.5px; font-weight: 700; color: var(--accent-ink); background: var(--surface-1);
    border: none; border-radius: 999px; padding: 7px 14px; cursor: pointer;
    box-shadow: 0 2px 6px rgba(122,76,15,0.10);
  }

  .weekday-row { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 6px; }
  .weekday-row div { text-align: center; font-size: 11px; font-weight: 700; color: var(--text-muted); padding: 4px 0; }

  .day-grid { display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: 1fr; gap: 4px; }
  .day-cell {
    aspect-ratio: 1 / 1;
    border-radius: 16px;
    background: var(--surface-1);
    border: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: 5px 2px 3px;
    cursor: pointer;
    position: relative;
  }

      statsEmptyRows: 'Sin tareas registradas en este período.', statsEmptyPeople: 'Añade personas en Ajustes para ver estadísticas.',

      tasksCardTitle: 'Tareas', peopleCardTitle: 'Personas',

      chooseColorTitle: 'Elige un color', chooseColorSub: 'Elige un color para ', reorderHandleLabel: 'Arrastra para reordenar'
    }
  };

  function detectDefaultLanguage() {
    var nav = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
    if (nav.indexOf('zh') === 0) return 'zh';
    if (nav.indexOf('es') === 0) return 'es';
    return 'en';
  }

  function t(key) {
    var lang = state.language;
    return (STR[lang] && STR[lang][key] !== undefined) ? STR[lang][key] : STR.en[key];
  }

  function capitalizeFirst(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  function monthYearLabel(year, monthIdx) {
    var lang = state.language;
    if (lang === 'zh') return year + '年' + MONTHS_FULL.zh[monthIdx];
    return MONTHS_FULL[lang][monthIdx] + ' ' + year;
  }
  function yearLabel(year) {
    return state.language === 'zh' ? (year + '年') : String(year);
  }
  function formatShortDate(d) {
    var lang = state.language, m = d.getMonth();
    if (lang === 'zh') return (m + 1) + '/' + d.getDate();
    if (lang === 'en') return MONTHS_SHORT.en[m] + ' ' + d.getDate();
    return d.getDate() + ' ' + MONTHS_SHORT.es[m];
  }
  function formatSheetTitle(d) {
    var lang = state.language, m = d.getMonth();
    var wd = (d.getDay() + 6) % 7;
    if (lang === 'en') return WEEKDAY_FULL.en[wd] + ', ' + MONTHS_FULL.en[m] + ' ' + d.getDate();
    if (lang === 'zh') return MONTHS_FULL.zh[m] + d.getDate() + '日 ' + WEEKDAY_FULL.zh[wd];
    return capitalizeFirst(WEEKDAY_FULL.es[wd] + ', ' + d.getDate() + ' de ' + MONTHS_FULL.es[m]);
  }
  function sheetSubtitleText(count) {
    var lang = state.language;
    if (count === 0) return t('sheetNone');
    if (lang === 'zh') return STR.zh.sheetOnePrefix + count + STR.zh.sheetOneSuffix;
    return count + (count === 1 ? t('sheetOne') : t('sheetMany'));
  }

  var today = new Date();
  today.setHours(0,0,0,0);

  var state = {
    language: detectDefaultLanguage(),
    tasks: [
      { id: 'task-1', name: 'Lavar los platos' },
      { id: 'task-2', name: 'Sacar la basura' },
      { id: 'task-3', name: 'Limpiar el baño' }
    ],
    people: [
      { id: 'person-1', name: 'Mamá', color: PERSON_COLOR_CHOICES[0] },
      { id: 'person-2', name: 'Papá', color: PERSON_COLOR_CHOICES[1] }
    ],
    entries: [],
    calYear: today.getFullYear(),
    calMonth: today.getMonth(),
    statsPeriod: 'week',
    statsTaskFilter: 'all',
    statsPersonFilter: 'all',
    statsAnchor: new Date(today),
    activeSheetDate: null
  };

  // seed a few sample entries across the current week for demo purposes
  (function seed() {
    function iso(d){ return toISO(d); }
    var d0 = new Date(today);
    state.entries.push({ id: 'e1', date: iso(d0), taskId: 'task-1', personId: 'person-1' });
    var d1 = new Date(today); d1.setDate(d1.getDate()-1);
    state.entries.push({ id: 'e2', date: iso(d1), taskId: 'task-2', personId: 'person-2' });
    var d2 = new Date(today); d2.setDate(d2.getDate()-2);
    state.entries.push({ id: 'e3', date: iso(d2), taskId: 'task-1', personId: 'person-2' });
    var d3 = new Date(today); d3.setDate(d3.getDate()-3);
    state.entries.push({ id: 'e4', date: iso(d3), taskId: 'task-3', personId: 'person-1' });
  })();

  function toISO(d) {
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function uid(prefix) { return prefix + '-' + Math.floor(Math.random()*1e9); }
  function personById(id) { return state.people.find(function(p){ return p.id === id; }); }
  function taskById(id) { return state.tasks.find(function(t){ return t.id === id; }); }
  function personColor(id) {
    var p = personById(id);
    return (p && p.color) || FALLBACK_COLOR;
  }
  function initials(name) {
    return (name || '?').trim().split(/\s+/).slice(0,2).map(function(w){ return w[0]; }).join('').toUpperCase();
  }

  document.getElementById('fab-btn').addEventListener('click', function () {
    switchTab('home');
    openSheet(today);
  });

  // ---------- Tabs ----------
  window.switchTab = function (tab) {
    ['home','stats','settings'].forEach(function (tabName) {
      document.getElementById('view-' + tabName).classList.toggle('active', tabName === tab);
    });
    document.querySelectorAll('.tab-btn').forEach(function (b) {
      b.classList.toggle('active', b.dataset.tab === tab);
    });
    document.getElementById('fab-btn').style.display = (tab === 'home') ? 'flex' : 'none';
    if (tab === 'stats') renderStats();
    if (tab === 'settings') renderSettings();
  };

  // ---------- Calendar ----------
  window.shiftMonth = function (delta) {
    state.calMonth += delta;
    if (state.calMonth < 0) { state.calMonth = 11; state.calYear--; }
    if (state.calMonth > 11) { state.calMonth = 0; state.calYear++; }
    renderCalendar();
  };
  window.goToday = function () {
    state.calYear = today.getFullYear();
    state.calMonth = today.getMonth();
    renderCalendar();
  };

  function renderCalendar() {
    document.getElementById('month-label').textContent = monthYearLabel(state.calYear, state.calMonth);
    var grid = document.getElementById('day-grid');
    grid.innerHTML = '';

    var firstOfMonth = new Date(state.calYear, state.calMonth, 1);
    var startOffset = (firstOfMonth.getDay() + 6) % 7; // Monday = 0
    var gridStart = new Date(firstOfMonth);
    gridStart.setDate(gridStart.getDate() - startOffset);

    for (var i = 0; i < 42; i++) {
      var d = new Date(gridStart);
      d.setDate(d.getDate() + i);
      grid.appendChild(buildDayCell(d));
    }
  }

  function buildDayCell(d) {
    var cell = document.createElement('div');
    cell.className = 'day-cell';
    if (d.getMonth() !== state.calMonth) cell.classList.add('outside');
    if (d.getTime() === today.getTime()) cell.classList.add('today');

    var num = document.createElement('div');
    num.className = 'num';
    num.textContent = d.getDate();
    cell.appendChild(num);

    var dayEntries = state.entries.filter(function (e) { return e.date === toISO(d); });
    var dots = document.createElement('div');
    dots.className = 'dots';
    dayEntries.slice(0, 3).forEach(function (e) {
      var dot = document.createElement('span');
      dot.className = 'dot';
      dot.style.background = personColor(e.personId);
      dots.appendChild(dot);
    });
    if (dayEntries.length > 3) {
      var more = document.createElement('span');
      more.className = 'more';
      more.textContent = '+' + (dayEntries.length - 3);
      dots.appendChild(more);
    }
    cell.appendChild(dots);

    cell.onclick = function () { openSheet(d); };
    return cell;
  }

  // ---------- Day sheet ----------
  function openSheet(d) {
    state.activeSheetDate = toISO(d);
    document.getElementById('sheet-title').textContent = formatSheetTitle(d);
    renderSheet();
    document.getElementById('sheet-backdrop').classList.add('open');
  }
  window.closeSheet = function () {
    document.getElementById('sheet-backdrop').classList.remove('open');
    state.activeSheetDate = null;
  };

  function renderSheet() {
    var iso = state.activeSheetDate;
    var dayEntries = state.entries.filter(function (e) { return e.date === iso; });

    document.getElementById('sheet-sub').textContent = sheetSubtitleText(dayEntries.length);

    var list = document.getElementById('sheet-entries');
    list.innerHTML = '';
    if (!dayEntries.length) {
      var empty = document.createElement('div');
      empty.className = 'empty-hint';
      empty.textContent = t('emptyNothingToday');
      list.appendChild(empty);
    } else {
      dayEntries.forEach(function (e) {
        var tk = taskById(e.taskId), p = personById(e.personId);
        var row = document.createElement('div');
        row.className = 'entry-row';
        row.innerHTML =
          '<div class="avatar" style="background:' + personColor(e.personId) + '">' + initials(p ? p.name : '?') + '</div>' +
          '<div class="entry-info">' +
            '<div class="entry-task">' + (tk ? tk.name : t('deletedTask')) + '</div>' +
            '<div class="entry-person">' + (p ? p.name : t('deletedPerson')) + '</div>' +
          '</div>' +
          '<button class="entry-del" data-id="' + e.id + '">✕</button>';
        row.querySelector('.entry-del').onclick = function () { deleteEntry(e.id); };
        list.appendChild(row);
      });
    }

    var addArea = document.getElementById('sheet-add-area');
    addArea.innerHTML = '';
    if (!state.tasks.length || !state.people.length) {
      var hint = document.createElement('div');
      hint.className = 'setup-hint';
      hint.innerHTML = t('setupHintPrefix') + '<b>' + t('setupHintTask') + '</b>' + t('setupHintAnd') + '<b>' + t('setupHintPerson') + '</b>' + t('setupHintSuffix');
      addArea.appendChild(hint);
      return;
    }

    var form = document.createElement('div');
    form.className = 'add-form';
    form.innerHTML =
      '<div class="field-label">' + t('filterLabel') + '</div>' +
      '<select id="sel-task">' + state.tasks.map(function (tk) { return '<option value="' + tk.id + '">' + tk.name + '</option>'; }).join('') + '</select>' +
      '<div class="field-label">' + t('thPerson') + '</div>' +
      '<select id="sel-person">' + state.people.map(function (p) { return '<option value="' + p.id + '">' + p.name + '</option>'; }).join('') + '</select>' +
      '<button class="btn-primary" id="btn-save-entry">' + t('addToThisDay') + '</button>';
    addArea.appendChild(form);
    document.getElementById('btn-save-entry').onclick = function () {
      var taskId = document.getElementById('sel-task').value;
      var personId = document.getElementById('sel-person').value;
      state.entries.push({ id: uid('e'), date: iso, taskId: taskId, personId: personId });
      renderSheet();
      renderCalendar();
    };
  }

  function deleteEntry(id) {
    state.entries = state.entries.filter(function (e) { return e.id !== id; });
    renderSheet();
    renderCalendar();
  }

  // ---------- Stats ----------
  document.getElementById('stats-segmented').addEventListener('click', function (ev) {
    var btn = ev.target.closest('button[data-p]');
    if (!btn) return;
    state.statsPeriod = btn.dataset.p;
    document.querySelectorAll('#stats-segmented button').forEach(function (b) { b.classList.toggle('active', b === btn); });
    renderStats();
  });

  document.getElementById('stats-task-filter').addEventListener('change', function (ev) {
    state.statsTaskFilter = ev.target.value;
    renderStats();
  });
  document.getElementById('stats-person-filter').addEventListener('change', function (ev) {
    state.statsPersonFilter = ev.target.value;
    renderStats();
  });

  function renderStatsTaskFilterOptions() {
    var sel = document.getElementById('stats-task-filter');
    var prevValue = state.statsTaskFilter;
    sel.innerHTML = '<option value="all" id="stats-filter-all-option">' + t('allTasksOption') + '</option>' +
      state.tasks.map(function (tk) { return '<option value="' + tk.id + '">' + tk.name + '</option>'; }).join('');
    var stillValid = prevValue === 'all' || state.tasks.some(function (tk) { return tk.id === prevValue; });
    if (!stillValid) { state.statsTaskFilter = 'all'; prevValue = 'all'; }
    sel.value = prevValue;
  }

  function renderStatsPersonFilterOptions() {
    var sel = document.getElementById('stats-person-filter');
    var prevValue = state.statsPersonFilter;
    sel.innerHTML = '<option value="all" id="stats-person-filter-all-option">' + t('allPeopleOption') + '</option>' +
      state.people.map(function (p) { return '<option value="' + p.id + '">' + p.name + '</option>'; }).join('');
    var stillValid = prevValue === 'all' || state.people.some(function (p) { return p.id === prevValue; });
    if (!stillValid) { state.statsPersonFilter = 'all'; prevValue = 'all'; }
    sel.value = prevValue;
  }

  window.shiftStatsPeriod = function (delta) {
    var d = new Date(state.statsAnchor);
    if (state.statsPeriod === 'week') d.setDate(d.getDate() + delta * 7);
    else if (state.statsPeriod === 'month') d.setMonth(d.getMonth() + delta);
    else d.setFullYear(d.getFullYear() + delta);
    state.statsAnchor = d;
    renderStats();
  };

  function periodRange() {
    var a = new Date(state.statsAnchor);
    if (state.statsPeriod === 'week') {
      var offset = (a.getDay() + 6) % 7;
      var start = new Date(a); start.setDate(start.getDate() - offset);
      var end = new Date(start); end.setDate(end.getDate() + 6);
      return { start: start, end: end, label: formatShortDate(start) + ' – ' + formatShortDate(end) };
    }
    if (state.statsPeriod === 'month') {
      var start = new Date(a.getFullYear(), a.getMonth(), 1);
      var end = new Date(a.getFullYear(), a.getMonth() + 1, 0);
      return { start: start, end: end, label: monthYearLabel(a.getFullYear(), a.getMonth()) };
    }
    var start = new Date(a.getFullYear(), 0, 1);
    var end = new Date(a.getFullYear(), 11, 31);
    return { start: start, end: end, label: yearLabel(a.getFullYear()) };
  }

  function renderStats() {
    renderStatsTaskFilterOptions();
    renderStatsPersonFilterOptions();
    var filterTask = state.statsTaskFilter !== 'all' ? taskById(state.statsTaskFilter) : null;
    var filterPerson = state.statsPersonFilter !== 'all' ? personById(state.statsPersonFilter) : null;

    var range = periodRange();
    document.getElementById('period-label').textContent = range.label;
    var startISO = toISO(range.start), endISO = toISO(range.end);
    var inRange = state.entries.filter(function (e) { return e.date >= startISO && e.date <= endISO; });
    if (filterTask) inRange = inRange.filter(function (e) { return e.taskId === filterTask.id; });
    if (filterPerson) inRange = inRange.filter(function (e) { return e.personId === filterPerson.id; });

    // Bars group by the dimension that ISN'T pinned to a single person: if a specific
    // person is selected, show that person's breakdown by task; otherwise show totals
    // by person (optionally narrowed to one task). People stay in their fixed settings
    // order and tasks stay in their fixed settings order so categorical color adjacency
    // (assigned by person index) is never reshuffled by sorting.
    var barsGroupBy = filterPerson ? 'task' : 'person';
    var barsTitleBase = barsGroupBy === 'person' ? t('totalByPersonTitle') : t('totalByTaskTitle');
    var titleSuffixParts = [];
    if (filterTask) titleSuffixParts.push(filterTask.name);
    if (filterPerson) titleSuffixParts.push(filterPerson.name);
    document.getElementById('stats-bars-title').textContent =
      barsTitleBase + (titleSuffixParts.length ? ' — ' + titleSuffixParts.join(', ') : '');

    var bars = document.getElementById('stats-bars');
    bars.innerHTML = '';
    if (!state.people.length) {
      bars.innerHTML = '<div class="empty-hint">' + t('statsEmptyPeople') + '</div>';
    } else if (barsGroupBy === 'person') {
      var personCounts = state.people.map(function (p) {
        return { label: p.name, color: personColor(p.id), count: inRange.filter(function (e) { return e.personId === p.id; }).length };
      });
      renderBarRows(personCounts);
    } else {
      var taskEntities = filterTask ? [filterTask] : state.tasks;
      var taskCounts = taskEntities.map(function (tk) {
        return { label: tk.name, color: personColor(filterPerson.id), count: inRange.filter(function (e) { return e.taskId === tk.id; }).length };
      });
      renderBarRows(taskCounts);
    }

    // Detail table: when exactly one of {task, person} is pinned, show a 2-column
    // breakdown of the other dimension; otherwise (neither or both pinned) show the
    // full Persona/Tarea/Veces breakdown, which naturally collapses to a single row
    // once both filters narrow the entries to one combination.
    var reducedDim = null;
    if (filterTask && !filterPerson) reducedDim = 'person';
    else if (filterPerson && !filterTask) reducedDim = 'task';

    if (reducedDim === 'person') document.getElementById('stats-table-title').textContent = t('detailPrefix') + filterTask.name;
    else if (reducedDim === 'task') document.getElementById('stats-table-title').textContent = t('detailPrefix') + filterPerson.name;
    else document.getElementById('stats-table-title').textContent = t('detailByTaskTitle');

    document.getElementById('stats-th-person').style.display = reducedDim === 'task' ? 'none' : '';
    document.getElementById('stats-th-task').style.display = reducedDim === 'person' ? 'none' : '';

    var rows;
    if (reducedDim === 'person') {
      rows = state.people.map(function (p) {
        return { cols: [p.name], count: inRange.filter(function (e) { return e.personId === p.id; }).length };
      }).filter(function (r) { return r.count > 0; }).sort(function (a, b) { return b.count - a.count; });
    } else if (reducedDim === 'task') {
      rows = state.tasks.map(function (tk) {
        return { cols: [tk.name], count: inRange.filter(function (e) { return e.taskId === tk.id; }).length };
      }).filter(function (r) { return r.count > 0; }).sort(function (a, b) { return b.count - a.count; });
    } else {
      var tally = {};
      inRange.forEach(function (e) {
        var key = e.personId + '|' + e.taskId;
        tally[key] = (tally[key] || 0) + 1;
      });
      rows = Object.keys(tally).map(function (key) {
        var parts = key.split('|');
        var p = personById(parts[0]), tk = taskById(parts[1]);
        return { cols: [p ? p.name : '—', tk ? tk.name : '—'], count: tally[key] };
      }).sort(function (a, b) { return b.count - a.count; });
    }

    var tbody = document.getElementById('stats-table-body');
    tbody.innerHTML = '';
    document.getElementById('stats-empty').style.display = rows.length ? 'none' : 'block';
    rows.forEach(function (r) {
      var tr = document.createElement('tr');
      tr.innerHTML = r.cols.map(function (c) { return '<td>' + c + '</td>'; }).join('') +
        '<td class="num-col">' + r.count + '</td>';
      tbody.appendChild(tr);
    });
  }

  function renderBarRows(items) {
    var bars = document.getElementById('stats-bars');
    var max = Math.max.apply(null, items.map(function (it) { return it.count; }).concat([1]));
    items.forEach(function (it) {
      var row = document.createElement('div');
      row.className = 'bar-row';
      var pct = it.count > 0 ? Math.max(6, (it.count / max) * 100) : 0;
      row.innerHTML =
        '<div class="bar-label">' + it.label + '</div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%; background:' + it.color + '"></div></div>' +
        '<div class="bar-count">' + it.count + '</div>';
      bars.appendChild(row);
    });
  }

  // ---------- Settings ----------
  window.addTask = function () {
    var input = document.getElementById('new-task-input');
    var name = input.value.trim();
    if (!name) return;
    state.tasks.push({ id: uid('task'), name: name });
    input.value = '';
    renderSettings();
  };
  window.addPerson = function () {
    var input = document.getElementById('new-person-input');
    var name = input.value.trim();
    if (!name) return;
    var color = PERSON_COLOR_CHOICES[state.people.length % PERSON_COLOR_CHOICES.length];
    state.people.push({ id: uid('person'), name: name, color: color });
    input.value = '';
    renderSettings();
  };

  function renderSettings() {
    renderTasksList();
    renderPeopleList();
  }

  var DRAG_HANDLE_SVG = '<svg viewBox="0 0 24 24" fill="none"><circle cx="9" cy="6" r="1.6" fill="currentColor"/><circle cx="15" cy="6" r="1.6" fill="currentColor"/><circle cx="9" cy="12" r="1.6" fill="currentColor"/><circle cx="15" cy="12" r="1.6" fill="currentColor"/><circle cx="9" cy="18" r="1.6" fill="currentColor"/><circle cx="15" cy="18" r="1.6" fill="currentColor"/></svg>';

  function renderTasksList() {
    var taskList = document.getElementById('tasks-list');
    taskList.innerHTML = '';
    if (!state.tasks.length) {
      taskList.innerHTML = '<div class="empty-list">' + t('emptyTasksHint') + '</div>';
      return;
    }
    state.tasks.forEach(function (tk) {
      var row = document.createElement('div');
      row.className = 'list-row';
      row.dataset.id = tk.id;
      row.innerHTML =
        '<button class="drag-handle" type="button" aria-label="' + t('reorderHandleLabel') + '">' + DRAG_HANDLE_SVG + '</button>' +
        '<input type="text" value="' + escapeHtml(tk.name) + '">' +
        '<button class="row-del">🗑</button>';
      var inp = row.querySelector('input');
      inp.oninput = function () { tk.name = inp.value; };
      inp.onblur = function () { if (!tk.name.trim()) { tk.name = t('noNameFallback'); renderTasksList(); } };
      row.querySelector('.row-del').onclick = function () {
        state.tasks = state.tasks.filter(function (x) { return x.id !== tk.id; });
        state.entries = state.entries.filter(function (e) { return e.taskId !== tk.id; });
        renderTasksList(); renderCalendar();
      };
      row.querySelector('.drag-handle').addEventListener('pointerdown', function (e) {
        startTaskDrag(e, tk.id);
      });
      taskList.appendChild(row);
    });
  }

  // ---- Drag-to-reorder for the tasks list (Pointer Events, touch-friendly) ----
  // On every pointermove we recompute which slot the pointer sits over from the
  // live DOM rows and, if it changed, splice state.tasks into the new order and
  // re-render the list. Since every dropdown that lists tasks (the Home day-sheet
  // select and the Stats task filter) reads from state.tasks in array order at
  // render time, reordering here keeps them in sync automatically.
  function startTaskDrag(e, taskId) {
    e.preventDefault();
    var taskList = document.getElementById('tasks-list');
    var row = taskList.querySelector('.list-row[data-id="' + taskId + '"]');
    if (!row) return;
    row.classList.add('dragging');
    document.body.style.userSelect = 'none';

    function currentIndex() {
      return state.tasks.findIndex(function (t) { return t.id === taskId; });
    }

    function onMove(ev) {
      var rows = Array.prototype.slice.call(taskList.querySelectorAll('.list-row'));
      var others = rows.filter(function (r) { return r.dataset.id !== taskId; });
      var targetIdx = others.length;
      for (var i = 0; i < others.length; i++) {
        var rect = others[i].getBoundingClientRect();
        var mid = rect.top + rect.height / 2;
        if (ev.clientY < mid) { targetIdx = i; break; }
      }
      var idx = currentIndex();
      if (idx === -1 || idx === targetIdx) return;
      var dragged = state.tasks[idx];
      var rest = state.tasks.filter(function (t) { return t.id !== taskId; });
      rest.splice(targetIdx, 0, dragged);
      state.tasks = rest;
      renderTasksList();
      var newRow = taskList.querySelector('.list-row[data-id="' + taskId + '"]');
      if (newRow) newRow.classList.add('dragging');
    }
    function onUp() {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.body.style.userSelect = '';
      var finalRow = taskList.querySelector('.list-row[data-id="' + taskId + '"]');
      if (finalRow) finalRow.classList.remove('dragging');
    }
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  }

  function renderPeopleList() {
    var peopleList = document.getElementById('people-list');
    peopleList.innerHTML = '';
    if (!state.people.length) {
      peopleList.innerHTML = '<div class="empty-list">' + t('emptyPeopleHint') + '</div>';
      return;
    }
    state.people.forEach(function (p) {
      var row = document.createElement('div');
      row.className = 'list-row';
      row.innerHTML =
        '<button class="swatch-btn" type="button" style="background:' + (p.color || FALLBACK_COLOR) + '" aria-label="' + t('chooseColorTitle') + '"></button>' +
        '<input type="text" value="' + escapeHtml(p.name) + '">' +
        '<button class="row-del">🗑</button>';
      row.querySelector('.swatch-btn').onclick = function () { openColorPopup(p.id); };
      var inp = row.querySelector('input');
      inp.oninput = function () { p.name = inp.value; };
      inp.onblur = function () { if (!p.name.trim()) { p.name = t('noNameFallback'); renderPeopleList(); } };
      row.querySelector('.row-del').onclick = function () {
        state.people = state.people.filter(function (x) { return x.id !== p.id; });
        state.entries = state.entries.filter(function (e) { return e.personId !== p.id; });
        renderPeopleList(); renderCalendar();
      };
      peopleList.appendChild(row);
    });
  }

  // ---------- Person color popup ----------
  var CHECK_MARK_SVG = '<svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var colorPopupPersonId = null;

  window.openColorPopup = function (personId) {
    colorPopupPersonId = personId;
    var p = personById(personId);
    document.getElementById('color-popup-title').textContent = t('chooseColorTitle');
    document.getElementById('color-popup-sub').textContent = t('chooseColorSub') + (p ? p.name : '');
    renderColorOptions();
    document.getElementById('color-backdrop').classList.add('open');
  };
  window.closeColorPopup = function () {
    document.getElementById('color-backdrop').classList.remove('open');
    colorPopupPersonId = null;
  };
  function renderColorOptions() {
    var grid = document.getElementById('color-options-list');
    grid.innerHTML = '';
    var p = personById(colorPopupPersonId);
    PERSON_COLOR_CHOICES.forEach(function (hex) {
      var isSelected = p && p.color === hex;
      var btn = document.createElement('button');
      btn.className = 'color-swatch-btn';
      btn.type = 'button';
      btn.style.background = hex;
      btn.innerHTML = isSelected ? CHECK_MARK_SVG : '';
      btn.onclick = function () {
        if (p) p.color = hex;
        renderPeopleList();
        renderCalendar();
        var activeView = document.querySelector('.view.active');
        if (activeView && activeView.id === 'view-stats') renderStats();
        closeColorPopup();
      };
      grid.appendChild(btn);
    });
  }

  // ---------- Language ----------
  function applyStaticI18n() {
    document.documentElement.lang = state.language === 'zh' ? 'zh-Hant' : state.language;
    document.getElementById('home-title').textContent = t('homeTitle');
    document.getElementById('home-subtitle').textContent = t('homeSubtitle');
    document.getElementById('banner-bold').textContent = t('bannerBold');
    document.getElementById('banner-rest').textContent = t('bannerRest');
    document.getElementById('today-btn').textContent = t('todayBtn');

    var wr = document.getElementById('weekday-row');
    wr.innerHTML = WEEKDAY_SHORT[state.language].map(function (w) { return '<div>' + w + '</div>'; }).join('');

    document.getElementById('stats-title').textContent = t('statsTitle');
    document.getElementById('stats-subtitle').textContent = t('statsSubtitle');
    document.getElementById('stats-filter-label').textContent = t('filterLabel');
    document.getElementById('stats-filter-all-option').textContent = t('allTasksOption');
    document.getElementById('stats-person-filter-label').textContent = t('thPerson');
    document.getElementById('stats-person-filter-all-option').textContent = t('allPeopleOption');
    var segBtns = document.querySelectorAll('#stats-segmented button');
    segBtns[0].textContent = t('segWeek');
    segBtns[1].textContent = t('segMonth');
    segBtns[2].textContent = t('segYear');
    document.getElementById('stats-th-person').textContent = t('thPerson');
    document.getElementById('stats-th-task').textContent = t('thTask');
    document.getElementById('stats-th-count').textContent = t('thCount');
    document.getElementById('stats-empty').textContent = t('statsEmptyRows');

    document.getElementById('settings-title').textContent = t('settingsTitle');
    document.getElementById('settings-subtitle').textContent = t('settingsSubtitle');
    document.getElementById('tasks-card-title').textContent = t('tasksCardTitle');
    document.getElementById('people-card-title').textContent = t('peopleCardTitle');
    document.getElementById('new-task-input').placeholder = t('newTaskPlaceholder');
    document.getElementById('new-person-input').placeholder = t('newPersonPlaceholder');
    document.getElementById('language-card-title').textContent = t('languageCardTitle');
    document.getElementById('lang-popup-title').textContent = t('languageCardTitle');
    var currentLangMeta = LANG_META.filter(function (l) { return l.code === state.language; })[0];
    document.getElementById('language-row-current').textContent = currentLangMeta ? currentLangMeta.label : '';

    document.getElementById('tab-label-home').textContent = t('tabHome');
    document.getElementById('tab-label-stats').textContent = t('tabStats');
    document.getElementById('tab-label-settings').textContent = t('tabSettings');
    document.getElementById('fab-btn').setAttribute('aria-label', t('fabAria'));
  }

  var LANG_META = [
    { code: 'en', label: 'English' },
    { code: 'zh', label: '繁體中文' },
    { code: 'es', label: 'Español' }
  ];
  var CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  window.openLangPopup = function () {
    renderLangOptions();
    document.getElementById('lang-backdrop').classList.add('open');
  };
  window.closeLangPopup = function () {
    document.getElementById('lang-backdrop').classList.remove('open');
  };
  function renderLangOptions() {
    var list = document.getElementById('lang-options-list');
    list.innerHTML = '';
    LANG_META.forEach(function (entry) {
      var isSelected = entry.code === state.language;
      var row = document.createElement('div');
      row.className = 'lang-option-row' + (isSelected ? ' selected' : '');
      row.innerHTML = '<span>' + entry.label + '</span>' + (isSelected ? CHECK_SVG : '');
      row.onclick = function () {
        state.language = entry.code;
        applyLanguage();
        closeLangPopup();
      };
      list.appendChild(row);
    });
  }

  function applyLanguage() {
    applyStaticI18n();
    renderCalendar();
    var activeView = document.querySelector('.view.active');
    if (activeView && activeView.id === 'view-stats') renderStats();
    if (activeView && activeView.id === 'view-settings') renderSettings();
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  applyLanguage();
})();
</script>
